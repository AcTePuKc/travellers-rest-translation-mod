name: Build EmployeeRefresh Release

on:
  push:
    tags:
      - 'employee-refresh-v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^employee-refresh-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use semantic version format: $version"
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package EmployeeRefresh
        shell: pwsh
        run: |
          dotnet build .\src\TravellersRestEmployeeRefresh\TravellersRestEmployeeRefresh.csproj -c Release
          .\scripts\package-employee-refresh.ps1 -Version "${{ steps.release.outputs.version }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeRefresh-${{ steps.release.outputs.version }}
          path: dist/*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem .\dist\*.zip).FullName `
            --repo "${{ github.repository }}" `
            --title "EmployeeRefresh v${{ steps.release.outputs.version }}" `
            --generate-notes
