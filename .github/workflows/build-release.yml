name: Build Translation Loader Release

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language code matching translations/labels.<language>.txt
        required: true
        default: bg
        type: string
      version:
        description: Release version, for example 0.1.0
        required: true
        default: 0.1.0
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $language = "bg"
          }
          else {
            $version = "${{ inputs.version }}"
            $language = "${{ inputs.language }}"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use semantic version format: $version"
          }
          if ($language -notmatch '^[A-Za-z0-9_-]+$') {
            throw "Invalid language code: $language"
          }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "language=$language" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package release
        shell: pwsh
        run: .\scripts\package-release.ps1 -LanguageCode "${{ steps.release.outputs.language }}" -Version "${{ steps.release.outputs.version }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TravellersRestTranslationMod-${{ steps.release.outputs.version }}-${{ steps.release.outputs.language }}
          path: dist/*.zip

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem .\dist\*.zip).FullName `
            --repo "${{ github.repository }}" `
            --title "Travellers Rest Translation ${{ github.ref_name }}" `
            --generate-notes
